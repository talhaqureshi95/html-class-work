<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .card{
            box-shadow: 0 4px 8px 0 rgba(0,0,0,0.2);
            transition: 0.3s;
            width: 30%;
            border-radius: 5px;
        }
        .card:hover{
            box-shadow: 0 8px 16px 0 rgba(0,0,0,0.2);

        }
        img{
            border-radius: 5px 5px 0 0;
        }
        .container{
            /*       top/bottom,right/left */
            padding: 2px 16px;
        }
    </style>
</head>
<body>
   <div class="card">
    <img src="img3.jpg" width="100%" alt="">
    <div class="container">
        <h4>John Doe</h4>
        <p>Aptech Education Center</p>
    </div>
   </div> 
</body>
</html>
